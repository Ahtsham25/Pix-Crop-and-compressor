name: Build Android APK and AAB

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (all, release, debug)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Environment Files
        run: |
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          else
            touch .env
          fi

      - name: Set up Keystore and Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 1. Setup debug keystore if not present
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # 2. Setup upload/release keystore
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding KEYSTORE_BASE64 from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "STORE_PASSWORD=${STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret provided; generating build keystore..."
            keytool -genkey -v -keystore my-upload-key.jks -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=ImageCompressor,OU=Mobile,O=App,L=City,S=State,C=US"
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 9.3.1 || true
          fi
          if [ -f gradlew ]; then
            chmod +x gradlew
            echo "GRADLE_CMD=./gradlew" >> $GITHUB_ENV
          else
            echo "GRADLE_CMD=gradle" >> $GITHUB_ENV
          fi

      - name: Build APK and AAB
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'all' }}"
          echo "Building with target: $BUILD_TYPE using $GRADLE_CMD"

          if [ "$BUILD_TYPE" = "debug" ]; then
            $GRADLE_CMD :app:assembleDebug :app:bundleDebug --stacktrace
          elif [ "$BUILD_TYPE" = "release" ]; then
            $GRADLE_CMD :app:assembleRelease :app:bundleRelease --stacktrace
          else
            $GRADLE_CMD :app:assembleDebug :app:assembleRelease :app:bundleDebug :app:bundleRelease --stacktrace
          fi

      - name: Organize Artifacts
        run: |
          mkdir -p output/apk output/bundle
          find app/build/outputs/apk -name "*.apk" -exec cp {} output/apk/ \; 2>/dev/null || true
          find app/build/outputs/bundle -name "*.aab" -exec cp {} output/bundle/ \; 2>/dev/null || true
          echo "=== Built APKs ==="
          ls -lh output/apk || true
          echo "=== Built AABs ==="
          ls -lh output/bundle || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-apks
          path: output/apk/*.apk
          retention-days: 14
          if-no-files-found: warn

      - name: Upload AAB (Android App Bundle for Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: app-bundles
          path: output/bundle/*.aab
          retention-days: 14
          if-no-files-found: warn
